/right_arm/xcore_robot_interface:
  ros__parameters:
    arm_name: right
    robot_ip: "10.0.2.164"
    local_ip: "192.168.1.3"
    command_topic: /right_arm/arm_servo_command
    connect_on_start: false
    state_period_s: 0.02
    servo_period_s: 0.02
    servo_lookahead_s: 0.03
    servo_kp: 1.0
